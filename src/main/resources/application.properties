spring.application.name=taskmanager

# MySQL datasource
# spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cpt202_project_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cpt202_project_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver





# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
#token 的签名钥匙
app.jwt.secret=${JWT_SECRET:ChangeThisToAtLeast32CharsSecretKey123456}
#token 多久失效 24小时
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
